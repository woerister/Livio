name: Check site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keine Platzhalter mehr im Text
        run: |
          if grep -nE '\[[^]]*(einfügen|TODO)[^]]*\]' *.html; then
            echo "Platzhalter gefunden"; exit 1
          fi
      - name: Interne Links und Dateien prüfen
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for f in pathlib.Path('.').glob('*.html'):
              for m in re.finditer(r'(?:href|src)="\./([^"#]+)', f.read_text(encoding='utf-8')):
                  if not pathlib.Path(m.group(1)).exists():
                      bad.append(f"{f}: {m.group(1)}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY
      - name: HTML validieren
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: true
